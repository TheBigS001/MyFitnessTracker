<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Points"><title>Fitness Points</title>
<style>
:root{--bg:#fff;--bl:#e6f3fc;--b2:#a9d4f0;--bd:#2b7bb9;--g:#c9a227;--ink:#17324d;--mut:#62798e;--rd:#c0392b;--gr:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1c29;--bl:#17304a;--b2:#2b5f87;--bd:#7bbbe6;--g:#e0b83a;--ink:#e8f1f8;--mut:#93aabd;--rd:#ef7d70;--gr:#5fc08a}}
:root[data-theme=dark]{--bg:#0f1c29;--bl:#17304a;--b2:#2b5f87;--bd:#7bbbe6;--g:#e0b83a;--ink:#e8f1f8;--mut:#93aabd;--rd:#ef7d70;--gr:#5fc08a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:130px}
main{max-width:640px;margin:auto;padding:14px}
h1{font:700 26px Georgia,serif;margin:4px 0 12px;border-bottom:3px solid var(--g);display:inline-block}h2{font:700 18px Georgia,serif;margin:18px 0 8px}
.c{background:var(--bl);border:1px solid var(--b2);border-radius:14px;padding:12px;margin:10px 0}.c.g{border-color:var(--g);border-width:2px}
.big{font:700 34px Georgia,serif;color:var(--bd)}.mut{color:var(--mut);font-size:13px}.w{background:#fdf3d0;color:#5a4500;border:1px solid var(--g);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g)}
button,select,input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--b2);background:var(--bg);color:var(--ink);max-width:100%}
button{background:var(--bd);color:#fff;border:0;font-weight:600}button.s{background:var(--bl);color:var(--bd);border:1px solid var(--b2)}button.gd{background:var(--g);color:#1d1600}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.r>input{flex:1;min-width:90px}.sp{justify-content:space-between}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:2px solid var(--g);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:13px}nav button.on{color:var(--bd);box-shadow:inset 0 3px var(--g)}
.ft{position:fixed;left:0;right:0;bottom:56px;background:var(--bl);border-top:1px solid var(--b2);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:4;margin-bottom:env(safe-area-inset-bottom,0px)}
.sw{font:700 52px Georgia,serif;text-align:center;color:var(--bd)}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:4px 6px;border-bottom:1px solid var(--b2);text-align:left}.ov{overflow-x:auto}.ok{color:var(--gr)}.no{color:var(--rd)}textarea{width:100%;height:90px}
</style></head><body><main id="m"></main><div id="f"></div>
<nav><button data-v="home">Home</button><button data-v="rec">Record</button><button data-v="log">Log</button><button data-v="ins">Insights</button><button data-v="set">Settings</button></nav>
<script>
const $=s=>document.querySelector(s),LS='fpt1';let V='home',C={},FIN=0;
function z(n){return String(n).padStart(2,'0')}function fd(d){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}function tod(){return fd(new Date())}
function load(){try{const x=JSON.parse(localStorage.getItem(LS));if(x)return x}catch(e){}
return{cfg:{start:null,mpp:.75,cpp:15,sd:30,warn:14,auto:tod(),pw:5,pm:15,ded:1,lim:{day:{on:1,v:10},week:{on:1,v:100},month:{on:1,v:450},q:{on:1,v:1450},year:{on:1,v:6200}}},recs:[],sweet:{},pens:[],draft:null,ways:[{n:'push ups',h:9}],ins:[{m:'pts',a:'day',r:30,v:'bar'},{m:'pts',a:'week',r:90,v:'table'},{m:'pts',a:'day',r:7,v:'avg'},{m:'pts',a:'day',r:7,v:'best'},{m:'rec',a:'day',r:30,v:'avg'}]}}
let S=load();function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const f2=n=>String(Math.round(n*100)/100);function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pd(s){return Date.parse(s+'T00:00:00Z')}function di(s){return Math.round((pd(s)-pd(S.cfg.start))/864e5)}function dof(i){return new Date(pd(S.cfg.start)+i*864e5).toISOString().slice(0,10)}
const PD={week:[7,52],month:[30,12],q:[91,4],year:[365,1]},NM={day:'Today',week:'This week',month:'This month',q:'This 3 months',year:'This year'};
function per(k,i){const[a,n]=PD[k],x=Math.min(Math.floor(i/a),n-1),s=x*a;return{s,e:x==n-1?364:s+a-1}}
const sm=(a,b)=>C.dn.slice(Math.max(a,0),b+1).reduce((x,y)=>x+y,0),sw=(a,b)=>C.sw.slice(Math.max(a,0),b+1).reduce((x,y)=>x+y,0)/S.cfg.sd,adj=(a,b)=>sm(a,b)-sw(a,b);
const tot=r=>r.items.reduce((a,i)=>a+ +i.p,0),app=r=>Object.values(r.pen||{}).reduce((a,b)=>a+ +b,0),net=r=>tot(r)-(S.cfg.ded?app(r):0);
function ep(k){const c=S.cfg;if(!c.lim[k].on)return;const L=PD[k][0],N=PD[k][1],pw=k=='week'?7:14,lim=c.lim[k].v,ai=di(c.auto),pp=k=='week'?c.pw:c.pm;let n=0,pay=null,g=0;
while(g++<500){if(!pay){if(n>=N)break;const s=n*L,e=n==N-1?364:s+L-1;if(e>=C.t)break;if(e>=ai){const a=adj(s,e);if(a<lim)pay={f:e+1,t:e+pw,r:lim-a+pw*lim/L}}n++}
else{if(pay.t>=C.t){C.pay[k]=pay;break}const a=sm(pay.f,pay.t);if(a>=pay.r){C.pens.push({id:'a-'+k+pay.t,pts:pp,start:dof(pay.t+1),days:pw,label:(k=='week'?'Weekly':'Monthly')+' penalty',auto:1});n=Math.floor((pay.t+1)/L);pay=null}else pay={f:pay.t+1,t:pay.t+pw,r:pay.r-a+pw*lim/L}}}}
function calc(){C={dn:Array(365).fill(0),sw:Array(365).fill(0),pay:{},pens:[]};if(!S.cfg.start)return;C.t=di(tod());
S.recs.forEach(r=>{const i=di(r.date);if(i>=0&&i<365)C.dn[i]+=net(r)});Object.entries(S.sweet).forEach(([d,v])=>{const i=di(d);if(i>=0&&i<365)C.sw[i]+=+v});
C.pens=S.pens.map(p=>({...p}));['week','month'].forEach(ep);
C.pens.forEach(p=>{p.used=S.recs.reduce((a,r)=>a+(+(r.pen||{})[p.id]||0),0);p.left=Math.max(0,p.pts-p.used);p.dl=di(p.start)+p.days-C.t})}
function stat(k){const c=S.cfg,v=c.lim[k].v,t=C.t;let s,e,T=v,earned,rem,lab='';if(k=='day')s=e=t;else({s,e}=per(k,t));const p=C.pay[k];
if(p){T=p.r;earned=sm(p.f,t);rem=p.t-t+1;lab='Payback: earn '+f2(p.r)+' points by '+dof(p.t)}else{earned=k=='day'?C.dn[t]:adj(s,Math.min(e,t));rem=Math.max(1,e-t+1)}
const need=(T-earned)/rem,len=e-s+1,el=t-s;return{k,earned,T,need,rem,lab,done:earned>=T,behind:!p&&k!='day'&&el>0&&(earned-C.dn[t])<T*el/len-1e-9}}
const lims=()=>Object.keys(NM).filter(k=>S.cfg.lim[k].on);
function home(){if(!S.cfg.start)return'<h1>Fitness Points</h1><div class="c g">Welcome. Open <b>Settings</b> and import your data file (or set your start date) to begin.</div>';
const st=lims().map(stat),w=[];st.forEach(s=>{if(s.k!='day'&&!s.done&&s.need>S.cfg.warn)w.push('You need '+f2(s.need)+' points/day to meet the '+NM[s.k].toLowerCase()+' limit.');if(s.behind)w.push('Behind pace for '+NM[s.k].toLowerCase()+'.')});
C.pens.forEach(p=>{if(p.left>0&&p.dl<0)w.push(p.label+' is overdue: '+f2(p.left)+' points still owed.')});
const d=st.find(s=>s.k=='day');let h='<h1>Fitness Points</h1>'+w.map(x=>'<div class="w">⚠ '+x+'</div>').join('');
if(d)h+='<div class="c g"><div class="mut">Today</div><div class="big '+(d.done?'ok':'')+'">'+(d.done?'Done ✓':f2(d.T-d.earned)+' points left')+'</div><div class="mut">'+f2(d.earned)+' of '+d.T+' points</div></div>';
h+=st.filter(s=>s.k!='day').map(s=>'<div class="c"><div class="r sp"><b>'+NM[s.k]+'</b><span class="'+(s.behind?'no':'ok')+'">'+(s.done?'Met ✓':s.behind?'Behind':'On track')+'</span></div><div>'+f2(s.earned)+' / '+f2(s.T)+'</div><div class="bar"><i style="width:'+Math.min(100,Math.max(0,s.earned/s.T*100))+'%"></i></div><div class="mut">'+(s.done?'Limit reached':'Average needed: <b>'+f2(s.need)+'</b> points/day over '+s.rem+' day'+(s.rem>1?'s':''))+'</div>'+(s.lab?'<div class="w">'+s.lab+'</div>':'')+'</div>').join('');
const ap=C.pens.filter(p=>p.left>0);h+='<h2>Penalties</h2>'+(ap.length?ap.map(p=>'<div class="c"><b>'+esc(p.label||'Penalty')+'</b>: '+f2(p.left)+' of '+p.pts+' points left<div class="mut">'+(di(p.start)>C.t?'Starts '+p.start+' (in '+(di(p.start)-C.t)+' days), then '+p.days+' days to clear':p.dl>=0?p.dl+' days left to clear':'Overdue by '+(-p.dl)+' days')+'</div></div>').join(''):'<div class="mut">No penalties.</div>');
h+='<div class="mut">Tip: the app icon badge shows today’s points left once the app is on your Home Screen.</div>';return h}
const sws=()=>{const w=S.draft.sw;return w.a+(w.r?Date.now()-w.t:0)},fm=ms=>{const s=Math.floor(ms/1e3);return z(Math.floor(s/60))+':'+z(s%60)};
function wo(p){return'<option value="">Pick a way…</option>'+S.ways.map(w=>'<option>'+f2(w.h*p*2)+' '+esc(w.n)+'</option>').join('')}
function rec(){const d=S.draft;if(!d)return'<h1>Record</h1><div class="c g"><p>Start a recording, add timed exercise or points, then finish to save it. You can do several a day.</p><button class="gd" onclick="A.st()">Start recording</button></div>';
const t=d.items.reduce((a,i)=>a+ +i.p,0),w=d.sw;
let h='<h1>Record</h1><div class="c"><div class="sw" id="swt">'+fm(sws())+'</div><div class="r"><button onclick="A.swt()">'+(w.r?'Stop':'Start')+'</button><button class="s" onclick="A.swr()">Reset</button></div>'+
'<div class="r"><select id="xm" onchange="A.mode()"><option value="p">Points</option><option value="c">Calories</option></select><input id="xv" type="number" step="any" placeholder="Amount"><button class="gd" onclick="A.addEx()">Log exercise</button></div>'+
'<div class="r" id="xx" style="display:none"><input id="xs" placeholder="Speed"><input id="xg" placeholder="Grade %"><input id="xw" placeholder="Weight"></div><div class="mut">Timer time is saved with the points and can’t be edited later.</div></div>'+
'<div class="c"><b>Add points</b><div class="r"><input id="pp" type="number" step="0.5" value="0.5" oninput="A.wo()"><select id="pw">'+wo(.5)+'</select></div><div class="r"><input id="po" placeholder="…or type your own"><button onclick="A.addP()">Add</button></div></div><h2>This recording</h2>';
h+=d.items.map((i,x)=>'<div class="c r sp"><span>'+esc(i.l)+(i.sw?' · '+fm(i.sw*1e3):'')+(i.cal?' · '+i.cal+' cal':'')+'</span><span><button class="s" onclick="A.ei('+x+')">'+f2(i.p)+' pts ✎</button> <button class="s" onclick="A.di('+x+')">✕</button></span></div>').join('')||'<div class="mut">Nothing yet.</div>';
if(FIN){const ap=C.pens.filter(p=>p.left>0&&di(p.start)<=C.t);h+='<div class="c g"><b>Finish: '+f2(t)+' points</b>'+(ap.length?'<div class="mut">Use some of this day’s points on a penalty:</div>'+ap.map(p=>'<div class="r">'+esc(p.label||'Penalty')+' ('+f2(p.left)+' left)<input data-pen="'+p.id+'" type="number" step="0.5" min="0" placeholder="0"></div>').join(''):'')+'<div class="r"><button class="gd" onclick="A.ok()">Save recording</button><button class="s" onclick="A.fin(0)">Back</button></div></div>'}
return h+'</div>'}
function foot(){const d=S.draft;$('#f').innerHTML=V=='rec'&&d?'<div class="ft"><div><div class="mut">Points so far</div><b class="big">'+f2(d.items.reduce((a,i)=>a+ +i.p,0))+'</b></div><div class="r"><button class="s" onclick="A.cx()">Discard</button><button class="gd" onclick="A.fin(1)">Finish</button></div></div>':''}
function log(){let h='<h1>Log</h1><div class="c"><b>Add past entry</b><div class="r"><input id="ld" type="date" value="'+tod()+'"><input id="ll" placeholder="What (optional)"></div><div class="r"><input id="lp" type="number" step="0.5" placeholder="Points"><input id="lm" type="number" placeholder="Recording minutes"><button onclick="A.addPast()">Add</button></div></div><div class="c"><b>Sweet treat calories</b><div class="r"><input id="sd" type="date" value="'+tod()+'"><input id="sv" type="number" placeholder="Calories"><button onclick="A.sweet()">Save</button></div><div class="mut">Counted as points deducted at week level and above.</div></div>';
const g={};S.recs.forEach(r=>(g[r.date]=g[r.date]||[]).push(r));
Object.keys(g).sort().reverse().slice(0,60).forEach(d=>{const rs=g[d];h+='<div class="c"><div class="r sp"><b>'+d+'</b><span>'+f2(rs.reduce((a,r)=>a+net(r),0))+' pts'+(S.sweet[d]?' · 🍰 '+S.sweet[d]+' cal':'')+'</span></div>'+rs.map(r=>'<div class="r sp mut"><span>'+(r.st?new Date(r.st).toTimeString().slice(0,5)+' · ':'')+(r.dur?f2(r.dur)+' min recording':'no duration')+' <button class="s" onclick="A.ed('+r.id+')">✎</button>'+(app(r)?' · penalty −'+f2(app(r)):'')+'</span><button class="s" onclick="A.dr('+r.id+')">Delete</button></div>'+r.items.map((i,x)=>'<div class="r sp"><span>'+esc(i.l)+(i.sw?' · '+fm(i.sw*1e3):'')+(i.min?' · '+i.min+' min':'')+(i.cal?' · '+i.cal+' cal':'')+(i.speed?' · '+esc(i.speed)+' speed':'')+(i.grade?' · '+esc(i.grade)+'%':'')+(i.weight?' · '+esc(i.weight)+' wt':'')+'</span><button class="s" onclick="A.er('+r.id+','+x+')">'+f2(i.p)+' pts ✎</button></div>').join('')).join('')+'</div>'});
return h}
const MN={pts:'Points',min:'Exercise minutes',cal:'Calories',rec:'Recording minutes',n:'Recordings'};
function dv(m){const a=Array(365).fill(0);S.recs.forEach(r=>{const i=di(r.date);if(i<0||i>364)return;const I=r.items;a[i]+=m=='pts'?net(r):m=='min'?I.reduce((x,y)=>x+(+y.sw||0)/60+(+y.min||0),0):m=='cal'?I.reduce((x,y)=>x+(+y.cal||0),0):m=='rec'?+r.dur||0:1});return a}
function card(x,n){const a=dv(x.m),t=C.t,f0=x.r?Math.max(0,t-x.r+1):0,zz=x.a=='day'?1:x.a=='week'?7:30,b={};for(let i=f0;i<=t&&i<365;i++){const k=Math.floor(i/zz);b[k]=(b[k]||0)+a[i]}
const ks=Object.keys(b),vs=ks.map(k=>b[k]),lb=ks.map(k=>x.a=='day'?dof(+k).slice(5):(x.a=='week'?'W':'M')+(+k+1)),T=vs.reduce((p,q)=>p+q,0),mx=Math.max(1,...vs),mn=Math.min(...vs),ix=vs.indexOf(mx),il=vs.indexOf(mn);
const ti=MN[x.m]+' per '+x.a+(x.r?', last '+x.r+' days':', all time');let body='';
if(x.v=='avg')body='<div class="big">'+f2(T/(vs.length||1))+'</div><div class="mut">average</div>';else if(x.v=='total')body='<div class="big">'+f2(T)+'</div><div class="mut">total</div>';
else if(x.v=='best')body='<div class="big">'+f2(mx)+'</div><div class="mut">best ('+(lb[ix]||'-')+')</div>';else if(x.v=='worst')body='<div class="big">'+f2(vs.length?mn:0)+'</div><div class="mut">worst ('+(lb[il]||'-')+')</div>';
else if(x.v=='table')body='<div class="ov"><table>'+lb.map((l,i)=>'<tr><td>'+l+'</td><td>'+f2(vs[i])+'</td></tr>').join('')+'</table></div>';
else{const W=320,H=110,bw=W/Math.max(1,vs.length);body='<svg viewBox="0 0 320 130" style="width:100%">'+(x.v=='bar'?vs.map((v,i)=>'<rect x="'+(i*bw+1)+'" y="'+(H-v/mx*H)+'" width="'+Math.max(1,bw-2)+'" height="'+(v/mx*H)+'" fill="#c9a227"/>').join(''):'<polyline fill="none" stroke="#2b7bb9" stroke-width="2" points="'+vs.map((v,i)=>(i*bw+bw/2)+','+(H-v/mx*H)).join(' ')+'"/>')+'<text x="0" y="125" font-size="10" fill="#62798e">'+(lb[0]||'')+'</text><text x="320" y="125" font-size="10" text-anchor="end" fill="#62798e">'+(lb[lb.length-1]||'')+' · max '+f2(mx)+'</text></svg>'}
return'<div class="c"><div class="r sp"><b>'+ti+'</b><button class="s" onclick="A.rmi('+n+')">✕</button></div>'+body+'</div>'}
function insv(){const o=(a,b)=>Object.entries(a).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');
return'<h1>Insights</h1>'+(S.cfg.start?S.ins.map(card).join(''):'')+'<div class="c g"><b>Add an insight</b><div class="r"><select id="im">'+o(MN)+'</select><select id="ia">'+o({day:'per day',week:'per week',month:'per month'})+'</select><select id="ir">'+o({7:'7 days',14:'14 days',30:'30 days',90:'90 days',0:'All time'})+'</select><select id="iv">'+o({bar:'Bar chart',line:'Line chart',table:'Table',avg:'Average',best:'Best',worst:'Worst',total:'Total'})+'</select><button onclick="A.addi()">Add</button></div></div>'}
function setv(){const c=S.cfg,i=(l,p,v,t)=>'<div class="r sp"><span>'+l+'</span><input style="max-width:140px" type="'+(t||'number')+'" step="any" value="'+(v==null?'':v)+'" onchange="A.cf(\''+p+'\',this.value,'+(t=='date'?1:0)+')"></div>';
return'<h1>Settings</h1><div class="c"><b>Limits</b>'+Object.keys(NM).map(k=>'<div class="r sp"><label><input type="checkbox" '+(c.lim[k].on?'checked':'')+' onchange="A.tg(\''+k+'\',this.checked)"> '+NM[k].replace('This ','').replace('Today','Daily')+'</label><input style="max-width:110px" type="number" value="'+c.lim[k].v+'" onchange="A.cf(\'lim.'+k+'.v\',this.value)"></div>').join('')+i('Warn when needed average above','warn',c.warn)+'</div>'+
'<div class="c"><b>Basics</b>'+i('Start date','start',c.start,'date')+i('Minutes per point','mpp',c.mpp)+i('Calories per point','cpp',c.cpp)+i('Sweet treat calories per point','sd',c.sd)+i('Auto penalties count from','auto',c.auto,'date')+i('Weekly penalty points','pw',c.pw)+i('Monthly penalty points','pm',c.pm)+'<label><input type="checkbox" '+(c.ded?'checked':'')+' onchange="A.cf(\'ded\',this.checked?1:0)"> Penalty points deducted from period totals</label></div>'+
'<div class="c"><b>Add a penalty</b><div class="r"><input id="pn" placeholder="Name" value="Monthly penalty"><input id="pt" type="number" placeholder="Points" value="15"></div><div class="r"><input id="ps" type="date" value="'+(S.cfg.start?dof(C.t+10):tod())+'"><input id="pdy" type="number" value="14" placeholder="Days to clear"><button onclick="A.addPen()">Add</button></div><div class="mut">Start date is when it begins; days is how long you have to clear it.</div>'+S.pens.map((p,x)=>'<div class="r sp">'+esc(p.label)+' · '+p.pts+' pts · from '+p.start+' <button class="s" onclick="A.dp('+x+')">✕</button></div>').join('')+'</div>'+
'<div class="c"><b>Point shortcuts</b><div class="mut">Reps that earn half a point; scales in the Add points list.</div><div class="r"><input id="wn" placeholder="e.g. push ups"><input id="wh" type="number" placeholder="Reps per 0.5 pt"><button onclick="A.addW()">Add</button></div>'+S.ways.map((w,x)=>'<div class="r sp">'+w.h+' '+esc(w.n)+' = 0.5 pt <button class="s" onclick="A.dw('+x+')">✕</button></div>').join('')+'</div>'+
'<div class="c"><b>Import daily data (CSV)</b><div class="mut">Header: date,minutes,calories,sweet_treat_calories,points,recording_minutes. Dates as YYYY-MM-DD. Leave points blank to calculate from minutes and calories.</div><div class="r"><input type="file" accept=".csv,text/csv,.txt" onchange="A.imp(this.files[0])"></div></div>'+
'<div class="c"><b>Backup</b><div class="r"><button class="s" onclick="A.exp()">Show backup text</button><button class="s" onclick="A.impj()">Restore from text</button></div><textarea id="bk" placeholder="Copy backup text here, or paste to restore"></textarea></div>'}
